<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540" role="img" aria-labelledby="title desc">
<title id="title">Mercura architecture overview</title>
<desc id="desc">React communicates with FastAPI. The API saves jobs to SQLite and PDFs to local storage. A bounded worker pool reads both and calls Gemini.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="38" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Mercura Document Extractor</text>
<text x="40" y="76" text-anchor="start" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#475569">MVP target architecture - processing runs separately from the API</text>
